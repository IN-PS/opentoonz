// JVM tests of the Android app (Robolectric) wired to the real native engine
// built for the host (libotmengine.so for linux-x86_64).  See run-tests.sh.
//
// Robolectric 3.8 / Android 8.1 (API 27) is used because Robolectric 4.x
// depends on androidx.test artifacts that are only published on Google's
// Maven repository (not reachable from the build sandbox).  API 27 is inside
// the app's supported range (minSdk 26).
plugins { id 'java' }

repositories {
    mavenCentral()
    maven { url 'https://repo1.maven.org/maven2' }
}

def gen = file(System.getProperty('otm.gen', "$rootDir/../out/hosttest/gen"))
def nativeDir = System.getProperty('otm.nativeDir', "$rootDir/../out/hosttest/native")
def androidAll = 'org.robolectric:android-all:8.1.0-robolectric-4611349'

java { toolchain { languageVersion = JavaLanguageVersion.of(8) } }

sourceSets {
    main { java { srcDirs = ["$rootDir/../app/src/main/java", gen] } }
}

configurations { robolectricSdk }

dependencies {
    compileOnly androidAll
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.robolectric:robolectric:3.8'
    testCompileOnly androidAll
    testRuntimeOnly androidAll
    robolectricSdk(androidAll) { transitive = false }
}

def cfgDir = layout.buildDirectory.dir('robolectric-config')
tasks.register('robolectricConfig') {
    outputs.dir cfgDir
    doLast {
        def assets = cfgDir.get().dir('assets').asFile
        assets.mkdirs()
        // MyPaint presets, packaged as APK assets by build-apk.sh
        project.copy {
            from "$rootDir/../../stuff/library/mypaint brushes"
            into new File(assets, 'mypaint')
        }
        def f = cfgDir.get().file('com/android/tools/test_config.properties').asFile
        f.parentFile.mkdirs()
        // Robolectric 3.8 resolves these relative to the test working directory
        f.text = """android_merged_manifest=../app/src/main/AndroidManifest.xml
android_merged_resources=../app/src/main/res
android_merged_assets=${projectDir.toPath().relativize(assets.toPath())}
android_custom_package=org.opentoonz.mobile
"""
    }
}
def sdkDir = layout.buildDirectory.dir('robolectric-sdk')
tasks.register('robolectricSdk', Copy) {
    from configurations.robolectricSdk
    into sdkDir
}
sourceSets.test.runtimeClasspath += files(cfgDir)

test {
    workingDir = projectDir
    dependsOn 'robolectricConfig', 'robolectricSdk'
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', sdkDir.get().asFile.absolutePath
    systemProperty 'java.library.path', nativeDir
    environment 'OTM_LZOCOMPRESS', "${nativeDir}/lzocompress"
    environment 'OTM_LZODECOMPRESS', "${nativeDir}/lzodecompress"
    environment 'LD_LIBRARY_PATH', nativeDir
    maxHeapSize = '2g'
    testLogging { events 'passed', 'failed', 'skipped', 'standardOut'; exceptionFormat 'full'; showStandardStreams true }
    outputs.upToDateWhen { false }
}
